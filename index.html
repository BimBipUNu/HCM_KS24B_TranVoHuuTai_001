<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<main>
    <div>
        <h1>Quản lý sinh viên</h1>
        <form id="addNewStudent-form">
            <div class="col-12">
                <input type="text" class="form-control" id="name" placeholder="Họ và tên">
                <p id="errorName" class="error"></p>
            </div>
            <div class="col-12">
                <input type="text" class="form-control" id="id" placeholder="Mã số sinh viên">
                <p id="errorId" class="error"></p>
            </div>
            <div class="col-12">
                <input type="email" class="form-control" id="email" placeholder="Email">
                <p id="errorEmail" class="error"></p>
            </div>
            <div class="col-12">
                <input type="text" class="form-control" id="class" placeholder="Lớp">
                <p id="errorClass" class="error"></p>
            </div>
            <button type="button" class="btn btn-primary" onclick="addNewStudent()">Thêm sinh viên</button>
        </form>
    </div>
    <div class="display">
        <div class="col-12">
            <form id="formSearch">
                <input type="text" id="keyWord" class="form-control" placeholder="Tìm kiếm theo tên...">
            </form>
        </div>
        <table class="table table-bordered">
            <thead>
              <tr>
                <th scope="col">Họ và tên</th>
                <th scope="col">Mã số sinh viên</th>
                <th scope="col">Email</th>
                <th scope="col">Lớp</th>
                <th colspan="2" scope="col">Hành động</th>
              </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
          </table>
    </div>
  <!-- Modal Edit-->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Chỉnh sửa thông tin sinh viên</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="editStudent-form">
                <div class="col-12">
                    <input type="text" class="form-control" id="name-edit" placeholder="Họ và tên">
                    <p id="errorName-edit" class="error"></p>
                </div>
                <div class="col-12">
                    <input type="text" class="form-control" id="id-edit" placeholder="Mã số sinh viên" disabled>
                    <p id="errorId-edit" class="error"></p>
                </div>
                <div class="col-12">
                    <input type="email" class="form-control" id="email-edit" placeholder="Email">
                    <p id="errorEmail-edit" class="error"></p>
                </div>
                <div class="col-12">
                    <input type="text" class="form-control" id="class-edit" placeholder="Lớp">
                    <p id="errorClass-edit" class="error"></p>
                </div>
                <button type="button" class="btn btn-primary" id="updateStudent" >Cập nhật</button>
            </form>
        </div>
      </div>
    </div>
  </div>
</main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
